<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.0/shaka-player.compiled.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #000; color: #eee; }
  video { width: 100%; max-height: 70vh; background: #000; display: block; }
  #status { padding: 10px 14px; font: 13px/1.5 monospace; color: #aaa; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<video id="video" controls playsinline></video>
<pre id="status">Starting...</pre>

<script>
// ===== Config =====
const WORKER = "https://site-check.egomale82.workers.dev";
const BATCH_ID = "698ad3519549b300a5e1cc6a";
const SUBJECT_ID = "maths-by-sachin-jakhar-sir-095452";
const CHILD_ID = "6a940abbea1638c3a6570d44";
const CDN_PREFIX = "https://d1d34p8vz63oiq.cloudfront.net/";
// ==================

const statusEl = document.getElementById("status");
const videoEl = document.getElementById("video");

function say(msg, isErr = false) {
  statusEl.textContent += "\n" + msg;
  statusEl.style.color = isErr ? "#f66" : "#aaa";
  console.log("[player] " + msg);
}

async function main() {
  try {
    const qs = new URLSearchParams({ batchId: BATCH_ID, subjectId: SUBJECT_ID, childId: CHILD_ID });

    say("1. Fetching video URL (get-video-url) from Worker...");
    const vu = await fetch(`${WORKER}/video-url?${qs}`);
    say(`   status ${vu.status}`);

    say("1b. Fetching keys (get-video-with-keys) from Worker...");
    const r = await fetch(`${WORKER}/video-keys?${qs}`);
    say(`   status ${r.status}`);
    const { data } = await r.json();
    const keys = data.clearKeys || {};
    say(`   clearKeys count: ${Object.keys(keys).length}`);

    const signed = data.url + data.signedUrl;
    const playUrl = `${WORKER}/play?url=${encodeURIComponent(signed)}`;

    say("2. Checking manifest through Worker...");
    const m = await fetch(playUrl);
    const mtxt = await m.text();
    say(`   status ${m.status}, content-type: ${m.headers.get("content-type")}, length: ${mtxt.length}`);
    say("   starts with: " + mtxt.slice(0, 120).replace(/\s+/g, " "));
    if (!mtxt.includes("<MPD")) {
      throw new Error("Worker /play did not return an MPD (see line above)");
    }

    say("2b. Probing one segment (audio init.mp4) through Worker...");
    const segUrl = `${WORKER}/play?url=${encodeURIComponent(
      CDN_PREFIX + "54630198-ad9a-4612-adbd-a1d85b5099b3/dash/audio/init.mp4" + data.signedUrl
    )}`;
    const sg = await fetch(segUrl);
    const sbuf = await sg.arrayBuffer();
    say(`   status ${sg.status}, content-type: ${sg.headers.get("content-type")}, bytes: ${sbuf.byteLength}`);
    if (sg.status !== 200) {
      const errTxt = new TextDecoder().decode(sbuf).slice(0, 200);
      say("   segment error body: " + errTxt.replace(/\s+/g, " "), true);
    }

    say("3. Loading with shaka...");
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) throw new Error("shaka not supported here");

    const player = new shaka.Player();
    await player.attach(videoEl);
    player.addEventListener("error", e =>
      say(`   SHAKA ERROR code=${e.detail.code} category=${e.detail.category}`, true)
    );
    player.configure({ drm: { clearKeys: keys } });

    // Route CloudFront segment requests through the Worker, adding the signed query
    let segCount = 0;
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
      const uri = request.uris[0];
      if (uri.startsWith(CDN_PREFIX) && !uri.includes("Signature=")) {
        request.uris = [`${WORKER}/play?url=${encodeURIComponent(uri + data.signedUrl)}`];
        if (segCount++ < 2) say("   segment routed via Worker");
      }
    });

    await player.load(playUrl, null, "application/dash+xml");
    say("4. LOADED. Playing.");
    videoEl.play().catch(() => say("   press play to start"));
  } catch (e) {
    say("ERROR: " + (e.message || e), true);
    if (e.code) say(`   code=${e.code} category=${e.category} severity=${e.severity}`, true);
    if (e.data) say("   data: " + JSON.stringify(e.data).slice(0, 400), true);
    console.error("FULL ERROR:", e);
  }
}

main();
</script>
</body>
</html>
